name: Deploy portfolio to GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'lightbox.js'
      - 'i18n.js'
      - 'scripts/build-seo.mjs'
      - 'tests/controls.test.mjs'
      - 'tests/seo.test.mjs'
      - 'controls.js'
      - 'assets/**'
      - 'data/projects.json'
      - 'data/site-controls.json'
      - 'tools/**'
      - 'tests/portfolio-ui.test.mjs'
      - '.github/workflows/deploy-pages.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate redesigned site and owner project settings
        run: |
          node --check app.js
          node --check lightbox.js
          node --check i18n.js
          node --check controls.js
          node --check scripts/build-seo.mjs
          node scripts/build-seo.mjs
          node --test tests/portfolio-ui.test.mjs tests/controls.test.mjs tests/seo.test.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4