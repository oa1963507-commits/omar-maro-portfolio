name: Sync Omar Maro Behance projects
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'scripts/sync-via-provider.mjs'
      - 'tests/provider-sync.test.mjs'
      - '.github/workflows/sync-projects.yml'
  schedule:
    - cron: '23 */6 * * *' # UTC; GitHub can delay scheduled runs
permissions:
  contents: write
concurrency:
  group: portfolio-behance-sync
  cancel-in-progress: true
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate the catalog importer (no API credits used)
        run: node --test tests/*.test.mjs
      - name: Import complete public Behance projects via JSON provider
        env:
          SCRAPPA_API_KEY: ${{ secrets.SCRAPPA_API_KEY }}
        run: node scripts/sync-via-provider.mjs
      - name: Commit changes only if catalog or diagnostics changed
        run: |
          git config user.name 'omar-maro-portfolio[bot]'
          git config user.email 'omar-maro-portfolio[bot]@users.noreply.github.com'
          git add data/projects.json data/sync-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update full Behance projects and module galleries'
            git push
          fi